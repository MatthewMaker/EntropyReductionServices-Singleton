# Confirms the package imports and compiles on the Unity version the README claims.
#
# The filename is deliberately still ci.yml. GitHub keys a workflow — including whether it is
# disabled — to its path, and this one is currently disabled because it cannot pass: the runner
# exhausts its disk pulling the ~5 GB editor image, and there is no UNITY_LICENSE secret.
# Renaming the file would register a NEW workflow, enabled by default, which would run and fail
# immediately. Rename it to unity.yml when the job actually works.
#
# The analyzer used to be a second job here. It now lives in analyzer.yml so it can be enabled
# on its own; one workflow holding both meant disabling this also disabled the only checks that
# pass. The consequence of the split is that there is no longer a `needs:` edge, so this no
# longer waits for the analyzer to go green before spending a runner.
#
# Requires UNITY_LICENSE (and UNITY_EMAIL / UNITY_PASSWORD for a Personal licence) in repository
# secrets; see https://game.ci/docs/github/activation
name: Unity

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Restricted to main, tags and manual runs. The job pulls a ~5 GB editor image and takes far
  # longer than anything else here, which is a poor trade on every push to every pull request.
  # analyzer.yml runs everywhere, so a pull request keeps fast feedback on the rule set.
  #
  # One version, matching package.json's "unity" floor. 6000.3 is the current LTS, supported
  # until December 2027; 6.0 LTS ended in October 2026 and 2022 LTS in May 2025. The matrix stays
  # a matrix so a second version can be added by editing a list rather than restructuring the job.
  unity:
    name: Unity ${{ matrix.unityVersion }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 6000.3.24f1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Library
          # Keyed on what actually determines Library. Packages/** would also hash the
          # Analyzers~ tree, which Unity never imports, so editing an analyzer unit test
          # would bust the cache and force a full reimport.
          key: Library-${{ matrix.unityVersion }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.unityVersion }}-

      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          testMode: all
          checkName: Tests (${{ matrix.unityVersion }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # The action has no targetPlatform input, so customImage is the only way to choose
          # the editor image. Its default resolves to linux-il2cpp, whose IL2CPP toolchain this
          # job never uses: these are EditMode and PlayMode tests in the editor, not a player
          # build. The floating "-3" tag tracks the 3.x line rather than pinning a patch.
          customImage: unityci/editor:ubuntu-${{ matrix.unityVersion }}-base-3

# Notifies OpenUPM that a new versioned tag exists, so it scans and publishes without waiting for
# its polling pipeline, and reports success or failure here rather than silently.
#
# This does not replace registration: the package must already be listed in the OpenUPM curated
# list before this can publish anything.
#
# OpenUPM builds the package by cloning this repository at the tag and running `npm pack` in the
# folder holding package.json, so the tarball's contents are governed by that folder's .npmignore.
# The tag's version must equal the version field in package.json or the build is rejected.
name: OpenUPM

on:
  push:
    tags: ['v*']

# id-token lets the action authenticate by GitHub OIDC. There is deliberately no account, token,
# PAT or webhook secret to configure.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to OpenUPM
    runs-on: ubuntu-latest
    steps:
      - uses: openupm/openupm-action@v1
        with:
          package: com.entropyreductionservices.singleton
          tag: ${{ github.ref_name }}
